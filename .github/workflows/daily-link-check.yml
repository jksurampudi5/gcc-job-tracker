name: Refresh job links (Every 3 hours)

on:
  schedule:
    # Runs every 3 hours (at minute 0)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check application pages
        run: python3 scripts/check_jobs.py
      - name: Commit updated link status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No link-status changes."
            exit 0
          fi
          git commit -m "chore: refresh job link status (every 3h)"
          git push
